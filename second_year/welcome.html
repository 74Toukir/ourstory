<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Story of Us ❤️</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
     
    
</head>

<body>

    <div class="letter">

        <!-- Wax Seal -->
        <div class="seal">
            <img src="images/wax-seal.png" alt="Wax Seal">
        </div>

        <!-- Hero -->
        <section class="hero">

            <h1>
                The Story
                <span>of Us</span>
            </h1>

            <p class="subtitle">
                Every year with you has become
                another beautiful chapter
                of our story.
            </p>

            <div class="divider">
                ❦
            </div>

            <p class="quote">

                Some stories are written with ink.

                <br><br>

                Ours is written with memories,

                laughter,

                prayers,

                and love.

            </p>

            <button class="scroll">
                 Turn the Page →

            </button>

            <script src="js/script.js"></script>

        </section>

    </div>

</body>

</html>
